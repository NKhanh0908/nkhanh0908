<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>NKhanh0908 – Language Distribution</title>
  <desc>Animated neon bubble chart showing programming language usage percentages</desc>

  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0d1821"/>
      <stop offset="100%" stop-color="#060910"/>
    </radialGradient>
    <radialGradient id="bg2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#060910" stop-opacity="0"/>
    </radialGradient>
    <!-- Nebula glows -->
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ED8B00" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ED8B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <!-- Bubble fills -->
    <radialGradient id="gJava" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ED8B00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ED8B00" stop-opacity="0.07"/>
    </radialGradient>
    <radialGradient id="gTS" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.07"/>
    </radialGradient>
    <radialGradient id="gSQL" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.07"/>
    </radialGradient>
    <radialGradient id="gJS" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F7DF1E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F7DF1E" stop-opacity="0.07"/>
    </radialGradient>
    <radialGradient id="gHTML" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E34C26" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E34C26" stop-opacity="0.07"/>
    </radialGradient>
    <radialGradient id="gPy" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3572A5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3572A5" stop-opacity="0.07"/>
    </radialGradient>
    <radialGradient id="gCSS" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.07"/>
    </radialGradient>
    <!-- Bubble sheen -->
    <radialGradient id="sheen" cx="40%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filters -->
    <filter id="glowO" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowY" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowR" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowP" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Scan line gradient -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes float1 {
      0%   { transform: translate(0px, 0px); }
      25%  { transform: translate(14px, -18px); }
      50%  { transform: translate(-10px, -30px); }
      75%  { transform: translate(-20px, -12px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes float2 {
      0%   { transform: translate(0px, 0px); }
      20%  { transform: translate(-18px, 12px); }
      50%  { transform: translate(16px, 22px); }
      80%  { transform: translate(10px, -14px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes float3 {
      0%   { transform: translate(0px, 0px); }
      30%  { transform: translate(20px, 16px); }
      60%  { transform: translate(-12px, 24px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes float4 {
      0%   { transform: translate(0px, 0px); }
      35%  { transform: translate(-16px, -20px); }
      70%  { transform: translate(18px, -10px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes float5 {
      0%   { transform: translate(0px, 0px); }
      25%  { transform: translate(12px, 18px); }
      55%  { transform: translate(-14px, 10px); }
      80%  { transform: translate(8px, -16px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes float6 {
      0%   { transform: translate(0px, 0px); }
      40%  { transform: translate(-10px, -14px); }
      75%  { transform: translate(14px, 8px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes float7 {
      0%   { transform: translate(0px, 0px); }
      30%  { transform: translate(16px, -12px); }
      65%  { transform: translate(-8px, 18px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes nebula1 {
      0%,100% { transform: translate(0,0); opacity:1; }
      50%     { transform: translate(20px, -15px); opacity:0.7; }
    }
    @keyframes nebula2 {
      0%,100% { transform: translate(0,0); opacity:1; }
      50%     { transform: translate(-16px, 18px); opacity:0.6; }
    }
    @keyframes nebula3 {
      0%,100% { transform: translate(0,0); opacity:0.8; }
      50%     { transform: translate(14px, 12px); opacity:1; }
    }
    @keyframes scanmove {
      0%   { transform: translateY(-40px); opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:1; }
      100% { transform: translateY(380px); opacity:0; }
    }
    @keyframes pulse {
      0%,100% { opacity:0.7; }
      50%     { opacity:1; }
    }
    @keyframes fadein {
      from { opacity:0; }
      to   { opacity:1; }
    }
    .bubble { animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .b1 { animation-name: float1; animation-duration: 11s; }
    .b2 { animation-name: float2; animation-duration: 14s; animation-delay: -3s; }
    .b3 { animation-name: float3; animation-duration: 12s; animation-delay: -7s; }
    .b4 { animation-name: float4; animation-duration: 15s; animation-delay: -2s; }
    .b5 { animation-name: float5; animation-duration: 13s; animation-delay: -5s; }
    .b6 { animation-name: float6; animation-duration: 10s; animation-delay: -8s; }
    .b7 { animation-name: float7; animation-duration: 16s; animation-delay: -1s; }
    .neb1 { animation: nebula1 18s ease-in-out infinite; }
    .neb2 { animation: nebula2 22s ease-in-out infinite -6s; }
    .neb3 { animation: nebula3 16s ease-in-out infinite -10s; }
    .scan { animation: scanmove 8s linear infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .fadein { animation: fadein 1.2s ease-out forwards; }
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Background -->
  <rect width="680" height="340" fill="#060910" rx="14"/>
  <rect width="680" height="340" fill="url(#bg1)" rx="14"/>
  <rect width="680" height="340" fill="url(#bg2)" rx="14"/>

  <!-- Nebula blobs -->
  <ellipse class="neb1" cx="130" cy="100" rx="180" ry="140" fill="url(#neb1)"/>
  <ellipse class="neb2" cx="520" cy="220" rx="200" ry="160" fill="url(#neb2)"/>
  <ellipse class="neb3" cx="340" cy="280" rx="160" ry="120" fill="url(#neb3)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="0.5">
    <line x1="38" y1="0"   x2="38"  y2="340"/>
    <line x1="76" y1="0"   x2="76"  y2="340"/>
    <line x1="114" y1="0"  x2="114" y2="340"/>
    <line x1="152" y1="0"  x2="152" y2="340"/>
    <line x1="190" y1="0"  x2="190" y2="340"/>
    <line x1="228" y1="0"  x2="228" y2="340"/>
    <line x1="266" y1="0"  x2="266" y2="340"/>
    <line x1="304" y1="0"  x2="304" y2="340"/>
    <line x1="342" y1="0"  x2="342" y2="340"/>
    <line x1="380" y1="0"  x2="380" y2="340"/>
    <line x1="418" y1="0"  x2="418" y2="340"/>
    <line x1="456" y1="0"  x2="456" y2="340"/>
    <line x1="494" y1="0"  x2="494" y2="340"/>
    <line x1="532" y1="0"  x2="532" y2="340"/>
    <line x1="570" y1="0"  x2="570" y2="340"/>
    <line x1="608" y1="0"  x2="608" y2="340"/>
    <line x1="646" y1="0"  x2="646" y2="340"/>
    <line x1="0" y1="38"   x2="680" y2="38"/>
    <line x1="0" y1="76"   x2="680" y2="76"/>
    <line x1="0" y1="114"  x2="680" y2="114"/>
    <line x1="0" y1="152"  x2="680" y2="152"/>
    <line x1="0" y1="190"  x2="680" y2="190"/>
    <line x1="0" y1="228"  x2="680" y2="228"/>
    <line x1="0" y1="266"  x2="680" y2="266"/>
    <line x1="0" y1="304"  x2="680" y2="304"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00d4ff" stroke-opacity="0.2" stroke-width="1" fill="none">
    <path d="M14,14 L54,14 M14,14 L14,54"/>
    <path d="M666,14 L626,14 M666,14 L666,54"/>
    <path d="M14,326 L54,326 M14,326 L14,286"/>
    <path d="M666,326 L626,326 M666,326 L666,286"/>
  </g>

  <!-- Scan line -->
  <rect class="scan" x="0" y="0" width="680" height="36" fill="url(#scan)" rx="0"/>

  <!-- Header -->
  <g class="fadein">
    <text x="18" y="31" font-size="12" font-weight="700" fill="#e6edf3" letter-spacing="0.06em">NKhanh0908</text>
    <text x="18" y="44" font-size="9"  font-weight="400" fill="#8b949e" letter-spacing="0.14em">// LANGUAGE DISTRIBUTION</text>
  </g>

  <!-- ═══════════════════════════════════════════
       BUBBLE 1 — Java  r=86  center=(160,185)
  ═══════════════════════════════════════════ -->
  <g class="bubble b1" style="transform-origin:160px 185px">
    <!-- outer glow ring -->
    <circle cx="160" cy="185" r="92" fill="none" stroke="#ED8B00" stroke-opacity="0.15" stroke-width="1.5" filter="url(#glowO)"/>
    <!-- fill -->
    <circle cx="160" cy="185" r="86" fill="url(#gJava)"/>
    <!-- border -->
    <circle cx="160" cy="185" r="86" fill="none" stroke="#ED8B00" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glowO)"/>
    <!-- sheen arc -->
    <path d="M108,163 A86,86 0 0,1 212,163" fill="none" stroke="#ED8B00" stroke-opacity="0.15" stroke-width="0.8"/>
    <!-- sheen overlay -->
    <circle cx="160" cy="185" r="86" fill="url(#sheen)"/>
    <!-- label -->
    <text x="160" y="179" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3" filter="url(#glowO)">Java</text>
    <text x="160" y="198" text-anchor="middle" font-size="13" font-weight="400" fill="#ED8B00" filter="url(#glowO)">55%</text>
  </g>

  <!-- ═══════════════════════════════════════════
       BUBBLE 2 — SQL  r=44  center=(310,110)
  ═══════════════════════════════════════════ -->
  <g class="bubble b2" style="transform-origin:310px 110px">
    <circle cx="310" cy="110" r="48" fill="none" stroke="#00d4ff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#glowC)"/>
    <circle cx="310" cy="110" r="44" fill="url(#gSQL)"/>
    <circle cx="310" cy="110" r="44" fill="none" stroke="#00d4ff" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glowC)"/>
    <path d="M278,98 A44,44 0 0,1 342,98" fill="none" stroke="#00d4ff" stroke-opacity="0.15" stroke-width="0.8"/>
    <circle cx="310" cy="110" r="44" fill="url(#sheen)"/>
    <text x="310" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3" filter="url(#glowC)">SQL</text>
    <text x="310" y="121" text-anchor="middle" font-size="11" font-weight="400" fill="#00d4ff" filter="url(#glowC)">13%</text>
  </g>

  <!-- ═══════════════════════════════════════════
       BUBBLE 3 — TypeScript  r=38  center=(420,80)
  ═══════════════════════════════════════════ -->
  <g class="bubble b3" style="transform-origin:420px 80px">
    <circle cx="420" cy="80" r="42" fill="none" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="1.5" filter="url(#glowB)"/>
    <circle cx="420" cy="80" r="38" fill="url(#gTS)"/>
    <circle cx="420" cy="80" r="38" fill="none" stroke="#3B82F6" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glowB)"/>
    <path d="M393,69 A38,38 0 0,1 447,69" fill="none" stroke="#3B82F6" stroke-opacity="0.15" stroke-width="0.8"/>
    <circle cx="420" cy="80" r="38" fill="url(#sheen)"/>
    <text x="420" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3" filter="url(#glowB)">TypeScript</text>
    <text x="420" y="90" text-anchor="middle" font-size="10" font-weight="400" fill="#3B82F6" filter="url(#glowB)">10%</text>
  </g>

  <!-- ═══════════════════════════════════════════
       BUBBLE 4 — JavaScript  r=33  center=(540,155)
  ═══════════════════════════════════════════ -->
  <g class="bubble b4" style="transform-origin:540px 155px">
    <circle cx="540" cy="155" r="37" fill="none" stroke="#F7DF1E" stroke-opacity="0.12" stroke-width="1.5" filter="url(#glowY)"/>
    <circle cx="540" cy="155" r="33" fill="url(#gJS)"/>
    <circle cx="540" cy="155" r="33" fill="none" stroke="#F7DF1E" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glowY)"/>
    <path d="M517,144 A33,33 0 0,1 563,144" fill="none" stroke="#F7DF1E" stroke-opacity="0.15" stroke-width="0.8"/>
    <circle cx="540" cy="155" r="33" fill="url(#sheen)"/>
    <text x="540" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#e6edf3" filter="url(#glowY)">JavaScript</text>
    <text x="540" y="164" text-anchor="middle" font-size="9.5" font-weight="400" fill="#F7DF1E" filter="url(#glowY)">7%</text>
  </g>

  <!-- ═══════════════════════════════════════════
       BUBBLE 5 — HTML  r=33  center=(440,230)
  ═══════════════════════════════════════════ -->
  <g class="bubble b5" style="transform-origin:440px 230px">
    <circle cx="440" cy="230" r="37" fill="none" stroke="#E34C26" stroke-opacity="0.12" stroke-width="1.5" filter="url(#glowR)"/>
    <circle cx="440" cy="230" r="33" fill="url(#gHTML)"/>
    <circle cx="440" cy="230" r="33" fill="none" stroke="#E34C26" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glowR)"/>
    <path d="M417,219 A33,33 0 0,1 463,219" fill="none" stroke="#E34C26" stroke-opacity="0.15" stroke-width="0.8"/>
    <circle cx="440" cy="230" r="33" fill="url(#sheen)"/>
    <text x="440" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3" filter="url(#glowR)">HTML</text>
    <text x="440" y="239" text-anchor="middle" font-size="9.5" font-weight="400" fill="#E34C26" filter="url(#glowR)">7%</text>
  </g>

  <!-- ═══════════════════════════════════════════
       BUBBLE 6 — Python  r=28  center=(590,265)
  ═══════════════════════════════════════════ -->
  <g class="bubble b6" style="transform-origin:590px 265px">
    <circle cx="590" cy="265" r="32" fill="none" stroke="#3572A5" stroke-opacity="0.12" stroke-width="1.5" filter="url(#glowBl)"/>
    <circle cx="590" cy="265" r="28" fill="url(#gPy)"/>
    <circle cx="590" cy="265" r="28" fill="none" stroke="#3572A5" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glowBl)"/>
    <path d="M568,255 A28,28 0 0,1 612,255" fill="none" stroke="#3572A5" stroke-opacity="0.15" stroke-width="0.8"/>
    <circle cx="590" cy="265" r="28" fill="url(#sheen)"/>
    <text x="590" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3" filter="url(#glowBl)">Python</text>
    <text x="590" y="274" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3572A5" filter="url(#glowBl)">5%</text>
  </g>

  <!-- ═══════════════════════════════════════════
       BUBBLE 7 — CSS  r=22  center=(330,270)
  ═══════════════════════════════════════════ -->
  <g class="bubble b7" style="transform-origin:330px 270px">
    <circle cx="330" cy="270" r="26" fill="none" stroke="#a855f7" stroke-opacity="0.12" stroke-width="1.5" filter="url(#glowP)"/>
    <circle cx="330" cy="270" r="22" fill="url(#gCSS)"/>
    <circle cx="330" cy="270" r="22" fill="none" stroke="#a855f7" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glowP)"/>
    <path d="M314,262 A22,22 0 0,1 346,262" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-width="0.8"/>
    <circle cx="330" cy="270" r="22" fill="url(#sheen)"/>
    <text x="330" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3" filter="url(#glowP)">CSS</text>
    <text x="330" y="279" text-anchor="middle" font-size="9.5" font-weight="400" fill="#a855f7" filter="url(#glowP)">3%</text>
  </g>

</svg>
